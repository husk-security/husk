# Proves install.sh works everywhere users are told to run it: every major
# Linux distro under its own /bin/sh (dash, busybox ash, bash) and macOS, plus a
# real end-to-end install once a release exists.
#
# Layers:
#   1. shellcheck:    lint the installer and its test scripts.
#   2. linux-matrix:  per-distro container: portability plus an offline
#                     end-to-end run against a localhost HTTPS mock of GitHub,
#                     so no release is needed. Driven by `docker run` rather
#                     than a job `container:`, so checkout never hits the
#                     glibc-node-in-Alpine problem.
#   3. macos:         portability checks on Intel and Apple silicon runners.
#   4. real-release:  install the real signed release through the installer and
#                     confirm the resulting binary runs.
#
# Every third-party action is pinned to a full commit SHA, because husk itself
# flags actions that are not SHA-pinned.

name: install-test

# install.sh is the script users are told to pipe into their shell, so every
# change to it must be exercised automatically. `pull_request`, never
# `pull_request_target`: these jobs execute the proposed installer, so they must
# never see a privileged token or a self-hosted runner.
#
# Every job needs a GitHub-hosted runner, so the pull_request and push jobs are
# gated on the repository being public and begin running when it is.
on:
  pull_request:
    paths:
      - "install.sh"
      - "tests/install/**"
      - ".github/workflows/install-test.yml"
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "tests/install/**"
      - ".github/workflows/install-test.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag for the real-release e2e (e.g. v0.0.1). Empty = latest."
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: install-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: shellcheck
    if: >-
      github.event.repository.private != true ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint installer + test scripts
        run: |
          shellcheck --version
          # One invocation, so a finding in an early file does not hide the
          # rest. `-s sh` forces the POSIX dialect; every script is #!/bin/sh.
          shellcheck -s sh install.sh tests/install/*.sh

  linux-matrix:
    name: linux (${{ matrix.image }})
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'push') &&
      github.event.repository.private != true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - ubuntu:22.04
          - alpine:3.20
          - fedora:40
          - archlinux:latest
          # Tumbleweed rather than Leap: Leap's Python 3.6 cannot run the
          # end-to-end TLS mock server reliably.
          - opensuse/tumbleweed
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Portability + offline e2e in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src "${{ matrix.image }}" \
            sh tests/install/run-in-container.sh

  macos:
    name: macos (${{ matrix.os }})
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'push') &&
      github.event.repository.private != true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The macOS system curl uses Secure Transport and ignores CURL_CA_BUNDLE,
      # so the self-signed offline run is not reliable here. Portability is, and
      # the real install is covered by real-release-macos below.
      - name: Portability checks
        run: sh tests/install/portability.sh
      # macOS picks different startup files than Linux (.bash_profile, and zsh
      # by default), so the PATH suite has to run natively to cover that branch.
      - name: PATH handling
        run: sh tests/install/path-guidance.sh

  real-release:
    name: real release (${{ matrix.image }})
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - alpine:3.20
          - fedora:40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the real release in ${{ matrix.image }}
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e VERSION -e GITHUB_TOKEN="${GH_TOKEN}" \
            -v "$PWD:/src" -w /src "${{ matrix.image }}" \
            sh tests/install/real.sh

  real-release-macos:
    name: real release (macos-15)
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cosign (full supply-chain verification)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install the real release
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bindir="$HOME/.local/bin"
          # shellcheck disable=SC2086
          sh ./install.sh ${VERSION:+--version "$VERSION"} --force -b "$bindir"
          "$bindir/husk" --version
