apiVersion: v2
name: my-umbrella-app
description: An umbrella chart that pulls in Redis and PostgreSQL
type: application
version: 1.4.2
appVersion: "2.10.0"
maintainers:
  - name: Jane Doe
    email: dev@example.com
dependencies:
  - name: redis
    version: ^18.0.0
    repository: oci://registry-1.docker.io/bitnamicharts
  - name: postgresql
    version: "~12.5.0"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
