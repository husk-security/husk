name: hello-world
version: '6.4'
summary: The 'hello-world' of snaps
description: |
  This is a simple snap example that includes a few interesting binaries
  to demonstrate snaps and their confinement.
type: app
architectures:
- amd64
base: core22
grade: stable
confinement: strict
apps:
  hello-world:
    command: bin/echo
    plugs:
    - network
  env:
    command: bin/env
hooks:
  configure:
    plugs:
    - network
